<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title"><title id="title">下载工具包，导入 Figma 插件，加载 PlanWAM 示例</title><rect width="1120" height="300" rx="14" fill="#f5f5ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="32" y="40" font-size="11" letter-spacing="2" fill="#7a8e6d">QUICK START</text><g fill="#fff" stroke="#d5dfcd"><rect x="30" y="67" width="246" height="200" rx="9"/><rect x="302" y="67" width="246" height="200" rx="9"/><rect x="574" y="67" width="246" height="200" rx="9"/><rect x="846" y="67" width="246" height="200" rx="9"/></g><g fill="#236d4c" font-size="12"><text x="49" y="95">01 / DOWNLOAD</text><text x="321" y="95">02 / FIGMA DESKTOP</text><text x="593" y="95">03 / IMPORT</text><text x="865" y="95">04 / TRY IT</text></g><g fill="#244331" font-size="20" font-weight="550"><text x="49" y="132">下载并解压仓库</text><text x="321" y="132">打开 Figma 桌面版</text><text x="593" y="132">导入插件清单</text><text x="865" y="132">加载 PlanWAM 示例</text></g><g fill="#7a8d6d" font-size="12"><text x="49" y="165">Code → Download ZIP</text><text x="49" y="187">完整保留解压后的文件夹</text><text x="321" y="165">打开一个 Design 文件</text><text x="321" y="187">Plugins → Development</text><text x="593" y="165">Import plugin from manifest…</text><text x="593" y="187">选择 figma-plugin/manifest.json</text><text x="865" y="165">在插件中载入完整示例</text><text x="865" y="187">点击「生成到 Figma」</text></g><g fill="#edf4e5"><rect x="49" y="214" width="144" height="29" rx="5"/><rect x="321" y="214" width="131" height="29" rx="5"/><rect x="593" y="214" width="141" height="29" rx="5"/><rect x="865" y="214" width="140" height="29" rx="5"/></g><g fill="#527844" font-size="10"><text x="61" y="233">解压 ZIP</text><text x="333" y="233">打开 Design 文件</text><text x="605" y="233">运行本地插件</text><text x="877" y="233">生成可编辑图层</text></g><g fill="#a3b498" font-size="18"><text x="282" y="174">→</text><text x="554" y="174">→</text><text x="826" y="174">→</text></g></g>